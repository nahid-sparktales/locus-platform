openapi: 3.1.0
info:
  title: Locus Local Agent Protocol
  version: 1.1.0
  description: Versioned local-only health and WebSocket bootstrap surface. Browser actions and cited research-board messages use browser-wire.schema.json.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port: { default: "54321" }
paths:
  /api/health:
    get:
      operationId: agentHealth
      responses:
        "200":
          description: Agent runtime status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /ws/chat:
    get:
      operationId: agentWebSocketUpgrade
      responses:
        "101": { description: WebSocket protocol switch }
