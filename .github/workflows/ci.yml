name: Platform CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: agent/requirements-runtime.lock
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript, Swift, schemas, and fixtures
        run: pnpm typecheck && pnpm test && pnpm build
      - name: Install and verify the Python runtime
        run: |
          python -m pip install --require-hashes -r agent/requirements-runtime.lock
          python -m pip install --no-deps -e './agent[dev]'
          python -m pip install 'pytest>=8,<10' 'ruff>=0.12,<1' 'pip-audit>=2.9,<3'
          python -m ruff check agent/ollama_code agent/tests
          python -m pytest -q agent/tests
          python -m pip_audit --disable-pip -r agent/requirements-runtime.lock
