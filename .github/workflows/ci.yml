name: Platform CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: agent/requirements-runtime.lock
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript, Swift, schemas, and fixtures
        run: pnpm typecheck && pnpm test && pnpm build
      - name: Install and verify the Python runtime
        run: |
          python -m pip install --require-hashes -r agent/requirements-runtime.lock
          python -m pip install --no-deps -e './agent[dev]'
          python -m pip install 'pytest>=8,<10' 'ruff>=0.12,<1' 'pip-audit>=2.9,<3'
          python -m ruff check agent/ollama_code agent/tests
          python -m pytest -q agent/tests
          python -m pip_audit --disable-pip -r agent/requirements-runtime.lock
